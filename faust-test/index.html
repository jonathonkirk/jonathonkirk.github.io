<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Faust Sine Oscillator Test — Intro to Music Technology</title>
<style>
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    max-width: 700px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    background: #fafafa;
    color: #222;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  p.note {
    background: #eef4ff;
    border-left: 4px solid #4a7fd6;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
  }
  faust-widget {
    display: block;
    margin-top: 2rem;
    min-height: 220px;
  }
  footer {
    margin-top: 3rem;
    font-size: 0.8rem;
    color: #777;
  }
</style>
</head>
<body>

  <h1>Faust Sine Oscillator — Frequency Sweep Test</h1>

  <p class="note">
    Click the power/play button on the widget below, then drag the
    <strong>freq</strong> slider to sweep the sine wave from 20&nbsp;Hz up to
    10,000&nbsp;Hz.
  </p>

  <faust-widget>
    <!--
    import("stdfaust.lib");

    // Frequency slider: label, default, min, max, step
    freq = hslider("freq [unit:Hz]", 440, 20, 10000, 0.01) : si.smoo;

    // Gain slider so volume can be controlled from the page
    gain = hslider("gain", 0.3, 0, 1, 0.01) : si.smoo;

    process = os.osc(freq) * gain;
    -->
  </faust-widget>

  <footer>
    <a href="https://faust.grame.fr/" target="_blank" rel="noopener">Faust</a>
    and <a href="https://github.com/grame-cncm/faust-web-component" target="_blank" rel="noopener">faust-web-component</a>.
  </footer>

  <script src="faust-web-component.js"></script>

</body>
</html>
